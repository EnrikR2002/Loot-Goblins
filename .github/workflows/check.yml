name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Formatting, lint, and Rojo build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install notebook runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Reusing the pinned tools avoids GitHub's anonymous download rate limit (rokit 403s).
      - name: Restore pinned Roblox project tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      - name: Install pinned Roblox project tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Headless
      - name: Check project
        shell: pwsh
        run: ./scripts/check.ps1
